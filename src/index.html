<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>桌宠</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    html, body { background: transparent !important; margin: 0; padding: 0; overflow: hidden; }
  </style>
</head>
<body>
  <div id="pet-container">
    <div class="stars-bg" id="starsBg">
      <img src="star.png" class="stars-img" id="starsImg">
    </div>

    <div class="character-wrapper" id="characterWrapper">
      <div class="breathing">
        <img src="character.png" alt="桌宠" class="character">
      </div>
    </div>

    <div class="sparkle-layer" id="sparkleLayer">
      <img src="sparkle.png" class="sparkle">
      <img src="sparkle.png" class="sparkle">
      <img src="sparkle.png" class="sparkle">
      <img src="sparkle.png" class="sparkle">
      <img src="sparkle.png" class="sparkle">
      <img src="sparkle.png" class="sparkle">
    </div>

    <div class="animation-container" id="animContainer" style="display: none;">
      <video id="animVideo" class="animation-video" playsinline preload="auto" muted>
        <source src="animation.webm" type="video/webm">
      </video>
    </div>

    <div class="zzz-container" id="zzz">
      <span class="zzz">z</span>
      <span class="zzz">z</span>
      <span class="zzz">Z</span>
    </div>

    <div class="hearts-container" id="hearts">
      <span class="heart">♥</span>
      <span class="heart">♥</span>
      <span class="heart">♥</span>
    </div>

    <button class="close-btn" id="closeBtn">×</button>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
